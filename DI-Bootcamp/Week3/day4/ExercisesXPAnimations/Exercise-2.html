<!DOCTYPE html>
    <html>
    <head>
        <style>
        #container {
          width: 400px;
          height: 400px;
          position: relative;
          background: yellow;
        }
        #animate {
          width: 50px;
          height: 50px;
          position: absolute;
          background-color: red;
        }
        </style>
    </head>
    <body>
        <p><button onclick="myMove()">Click Me</button></p>
        <div id="container">
          <div id="animate"></div>
        </div>

        <script>
            let container = document.getElementById("container");
            let animate = document.getElementById("animate");
            let button = document.getElementById("moveButton");

            button.addEventListener("click", myMove);

            function myMove() {

                let position = 0;

                let timer = setInterval(function() {

                    position++;

                    animate.style.left = position + "px";

                    if (position === 350) {
                        clearInterval(timer);
                    }

                }, 1);
                }
        </script>
    </body>

    </html>
